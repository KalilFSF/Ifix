<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iFix | Área do Técnico</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <main class="login-container">
        <section class="login-card">

            <div class="logo">
                <div class="logo-top">
                    <div class="logo-info">
                        <span>iFix</span>
                        <p>Área do técnico</p>
                    </div>

                    <label class="theme-switch">
                        <input type="checkbox" class="themeToggle">
                        <span class="slider">
                            <svg class="icon sun" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="4"></circle>
                                <line x1="12" y1="1.5" x2="12" y2="4"></line>
                                <line x1="12" y1="20" x2="12" y2="22.5"></line>
                                <line x1="1.5" y1="12" x2="4" y2="12"></line>
                                <line x1="20" y1="12" x2="22.5" y2="12"></line>
                                <line x1="4.2" y1="4.2" x2="6" y2="6"></line>
                                <line x1="18" y1="18" x2="19.8" y2="19.8"></line>
                                <line x1="18" y1="6" x2="19.8" y2="4.2"></line>
                                <line x1="4.2" y1="19.8" x2="6" y2="18"></line>
                            </svg>
                            <svg class="icon moon" viewBox="0 0 24 24">
                                <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 9 9 0 1 0 20 14.5z"></path>
                            </svg>
                        </span>
                        <small class="theme-text">Tema</small>
                    </label>
                </div>
            </div>

            <!-- Tudo abaixo preenchido via JS (tecnico-home.js) a partir de GET /api/me -->
            <img
                id="fotoPerfil"
                src=""
                alt="Foto de perfil"
                style="width:88px;height:88px;border-radius:50%;object-fit:cover;margin-bottom:16px;display:none;"
            >

            <h1 id="nomeUsuario">Olá!</h1>
            <p class="subtitle" id="detalhesTecnico">
                Sua conta de técnico foi criada com sucesso. Em breve você poderá receber
                chamados, enviar orçamentos e registrar serviços por aqui.
            </p>

            <section style="margin-top: 20px; text-align:left;">
                <h2 style="margin-bottom:10px; font-size:1rem;">Chamados abertos</h2>
                <ul id="listaServicos" style="padding-left:18px; display:grid; gap:10px;"></ul>
            </section>

            <section style="margin-top:20px; text-align:left;">
                <h2 style="margin-bottom:10px; font-size:1rem;">Orçamentos enviados</h2>
                <ul id="listaAtendimentos" style="padding-left:18px; display:grid; gap:10px;"></ul>
            </section>

            <a href="/logout" class="primary-btn" style="display:block;text-align:center;text-decoration:none; margin-top:20px;">
                Sair
            </a>

        </section>
    </main>

    <script src="/js/theme.js"></script>
    <script src="/js/tecnico-home.js"></script>
</body>
</html>
