<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iFix | Cadastro</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/cadastro.css">
    <script src="/js/theme.js"></script>
</head>
<body>

    <!--
        Página com os 3 cards (escolha do tipo, form cliente, form técnico);
        cadastro.js mostra/esconde cada um trocando a classe "hidden".
        Os formulários são enviados via fetch (sem recarregar a página), então
        não precisam de valor pré-preenchido nem reabrir o card certo depois
        de um erro: a página nunca navega, o que a pessoa digitou continua ali.
    -->
    <main class="register-container">

        <section class="register-card" id="tipoConta">

            <div class="logo">
                <div class="logo-top">
                    <div class="logo-info">
                        <span>iFix</span>
                        <p>Assistência técnica</p>
                    </div>

                    <label class="theme-switch">
                        <input type="checkbox" class="themeToggle">
                        <span class="slider">
                            <svg class="icon sun" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="4"></circle>
                                <line x1="12" y1="1.5" x2="12" y2="4"></line>
                                <line x1="12" y1="20" x2="12" y2="22.5"></line>
                                <line x1="1.5" y1="12" x2="4" y2="12"></line>
                                <line x1="20" y1="12" x2="22.5" y2="12"></line>
                                <line x1="4.2" y1="4.2" x2="6" y2="6"></line>
                                <line x1="18" y1="18" x2="19.8" y2="19.8"></line>
                                <line x1="18" y1="6" x2="19.8" y2="4.2"></line>
                                <line x1="4.2" y1="19.8" x2="6" y2="18"></line>
                            </svg>
                            <svg class="icon moon" viewBox="0 0 24 24">
                                <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 9 9 0 1 0 20 14.5z"></path>
                            </svg>
                        </span>
                        <p class="theme-text">Tema</p>
                    </label>
                </div>
            </div>

            <h1>Criar conta</h1>
            <p class="subtitle">Escolha como deseja utilizar o iFix.</p>

            <div class="type-box">
                <button type="button" class="type-option" data-type="cliente">
                    <svg class="type-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="7" r="4"></circle>
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    </svg>
                    <div>
                        <strong>Cliente</strong>
                        <span>Solicitar assistência técnica</span>
                    </div>
                </button>

                <button type="button" class="type-option" data-type="tecnico">
                    <svg class="type-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H2a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 3.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H8a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <div>
                        <strong>Técnico</strong>
                        <span>Prestar assistência técnica</span>
                    </div>
                </button>
            </div>

            <a href="/" class="back-link">Já possui conta? Entrar</a>

        </section>

        <section class="register-card hidden" id="clienteCadastro">

            <div class="title-row">
                <h1>Cadastro de cliente</h1>

                <label class="theme-switch">
                    <input type="checkbox" class="themeToggle">
                    <span class="slider">
                        <svg class="icon sun" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="4"></circle>
                            <line x1="12" y1="1.5" x2="12" y2="4"></line>
                            <line x1="12" y1="20" x2="12" y2="22.5"></line>
                            <line x1="1.5" y1="12" x2="4" y2="12"></line>
                            <line x1="20" y1="12" x2="22.5" y2="12"></line>
                            <line x1="4.2" y1="4.2" x2="6" y2="6"></line>
                            <line x1="18" y1="18" x2="19.8" y2="19.8"></line>
                            <line x1="18" y1="6" x2="19.8" y2="4.2"></line>
                            <line x1="4.2" y1="19.8" x2="6" y2="18"></line>
                        </svg>
                        <svg class="icon moon" viewBox="0 0 24 24">
                            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 9 9 0 1 0 20 14.5z"></path>
                        </svg>
                    </span>
                    <p class="theme-text">TEMA</p>
                </label>
            </div>

            <div id="mensagemCliente" class="mensagem hidden"></div>
            <div id="avisoLocalizacaoCliente" class="mensagem mensagem-aviso hidden"></div>

            <form id="clienteForm">
                <div class="input-grid">
                    <div class="input-group">
                        <label>Nome completo</label>
                        <input type="text" name="nome" maxlength="100" required>
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" name="email" required>
                    </div>

                    <div class="input-group">
                        <label>Telefone</label>
                        <input type="text" class="telefone" name="telefone" placeholder="+55 (00) 00000-0000" maxlength="19" required>
                    </div>

                    <div class="input-group">
                        <label>CPF</label>
                        <input type="text" class="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                    </div>

                    <div class="input-group">
                        <label>Data de nascimento</label>
                        <input type="date" class="data-nascimento" name="data_nascimento" required>
                    </div>

                    <div class="input-group">
                        <label>País</label>
                        <select class="pais" name="pais" required>
                            <option value="">Selecione</option>
                            <option value="Brasil">Brasil</option>
                            <option value="Outro">Outro país</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>CEP</label>
                        <input type="text" class="cep endereco" name="cep" placeholder="00000-000" maxlength="9" required>
                    </div>

                    <div class="input-group">
                        <!-- Opções carregadas por JS via API do IBGE (cadastro.js + estadosCidades.js) -->
                        <label>Estado</label>
                        <select class="estado endereco" name="estado" required>
                            <option value="">Selecione o país primeiro</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Cidade</label>
                        <select class="cidade endereco" name="cidade" required>
                            <option value="">Selecione o estado primeiro</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Bairro</label>
                        <input type="text" class="bairro endereco" name="bairro" placeholder="Bairro" required>
                    </div>

                    <div class="input-group">
                        <label>Endereço</label>
                        <input type="text" class="rua endereco" name="endereco" placeholder="Rua, Avenida..." maxlength="100" required>
                    </div>

                    <div class="input-group">
                        <label>Número</label>
                        <input type="text" class="numero endereco" name="numero" placeholder="Número" maxlength="10" required>
                    </div>

                    <div class="input-group">
                        <label>Complemento</label>
                        <input type="text" class="complemento endereco" name="complemento" placeholder="Apartamento, bloco, referência..." maxlength="100">
                    </div>

                    <div class="input-group">
                        <label>Senha</label>
                        <input type="password" name="senha" required>
                    </div>

                    <div class="input-group">
                        <label>Confirmar senha</label>
                        <input type="password" name="confirmar_senha" required>
                    </div>
                </div>

                <div class="actions">
                    <button type="button" class="cancel-btn voltar">Voltar</button>
                    <button type="submit" class="primary-btn">Cadastrar</button>
                </div>
            </form>
        </section>

        <section class="register-card hidden" id="tecnicoCadastro">

            <div class="title-row">
                <h1>Cadastro de técnico</h1>

                <label class="theme-switch">
                    <input type="checkbox" class="themeToggle">
                    <span class="slider">
                        <svg class="icon sun" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="4"></circle>
                            <line x1="12" y1="1.5" x2="12" y2="4"></line>
                            <line x1="12" y1="20" x2="12" y2="22.5"></line>
                            <line x1="1.5" y1="12" x2="4" y2="12"></line>
                            <line x1="20" y1="12" x2="22.5" y2="12"></line>
                            <line x1="4.2" y1="4.2" x2="6" y2="6"></line>
                            <line x1="18" y1="18" x2="19.8" y2="19.8"></line>
                            <line x1="18" y1="6" x2="19.8" y2="4.2"></line>
                            <line x1="4.2" y1="19.8" x2="6" y2="18"></line>
                        </svg>
                        <svg class="icon moon" viewBox="0 0 24 24">
                            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 9 9 0 1 0 20 14.5z"></path>
                        </svg>
                    </span>
                    <p class="theme-text">TEMA</p>
                </label>
            </div>

            <div id="mensagemTecnico" class="mensagem hidden"></div>
            <div id="avisoLocalizacaoTecnico" class="mensagem mensagem-aviso hidden"></div>

            <form id="tecnicoForm">
                <div class="input-grid">
                    <div class="input-group">
                        <label>Nome completo</label>
                        <input type="text" name="nome" maxlength="100" required>
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" name="email" required>
                    </div>

                    <div class="input-group">
                        <label>Telefone</label>
                        <input type="text" class="telefone" name="telefone" placeholder="+55 (00) 00000-0000" maxlength="19" required>
                    </div>

                    <div class="input-group">
                        <label>CPF</label>
                        <input type="text" class="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                    </div>

                    <div class="input-group">
                        <label>Data de nascimento</label>
                        <input type="date" class="data-nascimento" name="data_nascimento" required>
                    </div>

                    <div class="input-group">
                        <label>Escolaridade</label>
                        <select name="escolaridade" required>
                            <option value="">Selecione</option>
                            <option>Ensino médio</option>
                            <option>Técnico</option>
                            <option>Superior cursando</option>
                            <option>Superior completo</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Curso superior</label>
                        <input type="text" name="curso_superior">
                    </div>

                    <div class="input-group">
                        <label>País</label>
                        <select class="pais" name="pais" required>
                            <option value="">Selecione</option>
                            <option value="Brasil">Brasil</option>
                            <option value="Outro">Outro país</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>CEP</label>
                        <input type="text" class="cep endereco" name="cep" placeholder="00000-000" maxlength="9" required>
                    </div>

                    <div class="input-group">
                        <label>Estado</label>
                        <select class="estado endereco" name="estado" required>
                            <option value="">Selecione o país primeiro</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Cidade</label>
                        <select class="cidade endereco" name="cidade" required>
                            <option value="">Selecione o estado primeiro</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Bairro</label>
                        <input type="text" class="bairro endereco" name="bairro" placeholder="Bairro" required>
                    </div>

                    <div class="input-group">
                        <label>Endereço</label>
                        <input type="text" class="rua endereco" name="endereco" placeholder="Rua, Avenida..." maxlength="100" required>
                    </div>

                    <div class="input-group">
                        <label>Número</label>
                        <input type="text" class="numero endereco" name="numero" placeholder="Número" maxlength="10" required>
                    </div>

                    <div class="input-group">
                        <label>Complemento</label>
                        <input type="text" class="complemento endereco" name="complemento" placeholder="Apartamento, bloco, referência..." maxlength="100">
                    </div>

                    <div class="input-group">
                        <label>Região de atendimento</label>
                        <input type="text" name="regiao_atendimento" placeholder="Ex: Zona Sul, Centro, toda a cidade..." required>
                    </div>

                    <div class="input-group">
                        <label>Especialidade</label>
                        <input type="text" name="especialidade" placeholder="Ex: Celulares, notebooks, TVs..." required>
                    </div>

                    <div class="input-group">
                        <label>Foto de perfil</label>
                        <input type="file" name="foto_perfil" accept="image/*" required>
                    </div>

                    <div class="input-group">
                        <label>Diplomas e certificados</label>
                        <input type="file" name="diplomas" accept="image/*,.pdf" multiple>
                    </div>

                    <div class="input-group">
                        <label>Senha</label>
                        <input type="password" name="senha" required>
                    </div>

                    <div class="input-group">
                        <label>Confirmar senha</label>
                        <input type="password" name="confirmar_senha" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Cursos e experiências</label>
                    <textarea name="cursos_experiencias" placeholder="Descreva seus cursos e experiências"></textarea>
                </div>

                <div class="input-group">
                    <label>Especializações</label>
                    <textarea name="especializacoes" placeholder="Ex: Sou profissional em concertos de celulares, notebooks e..."></textarea>
                </div>

                <div class="actions">
                    <button type="button" class="cancel-btn voltar">Voltar</button>
                    <button type="submit" class="primary-btn">Cadastrar</button>
                </div>
            </form>
        </section>

    </main>

    <script src="/js/estadosCidades.js"></script>
    <script src="/js/geolocalizacao.js"></script>
    <script src="/js/cadastro.js"></script>
</body>
</html>
